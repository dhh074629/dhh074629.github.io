<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="BossFlow">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202c"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="boss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ce0a8"/>
      <stop offset="1" stop-color="#22b884"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#63c0ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="none" stroke="#23303e"/>

  <!-- 老板：一块实心方块，位置最高、最亮 -->
  <rect x="18" y="26" width="24" height="44" rx="8" fill="url(#boss)"/>

  <!-- 派活的流向：三条细线 -->
  <g stroke="#31435a" stroke-width="2.5" stroke-linecap="round">
    <line x1="42" y1="32" x2="56" y2="28"/>
    <line x1="42" y1="48" x2="56" y2="48"/>
    <line x1="42" y1="64" x2="56" y2="68"/>
  </g>

  <!-- 工人：三条小条，下面的颜色渐弱 -->
  <rect x="56" y="22" width="22" height="12" rx="6" fill="url(#w1)"/>
  <rect x="56" y="42" width="22" height="12" rx="6" fill="#35d39a"/>
  <rect x="56" y="62" width="22" height="12" rx="6" fill="#4aa8ff" opacity="0.55"/>
</svg>
